name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: PSScriptAnalyzer (errors only, pinned version)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }

  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    # step-level "shell" does not accept the matrix context; job defaults do
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Enable TaskScheduler log (CI VM only, for smoke-test forensics)
        shell: powershell
        run: wevtutil sl Microsoft-Windows-TaskScheduler/Operational /e:true
      - name: Read-only guard
        run: ./tests/Test-ReadOnly.ps1
      - name: Guard self-test
        run: ./tests/Test-GuardSelf.ps1
      - name: Smoke test (state fingerprint)
        run: ./tests/Test-Smoke.ps1
      - name: Defender data unavailable (Error, never Pass)
        run: ./tests/Test-DefenderUnavailable.ps1
